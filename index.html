<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Check the Water — BUGGAMES</title>
<link rel="stylesheet" href="styles.css"><link rel="manifest" href="manifest.webmanifest"></head>
<body>
<div id="intro"><h1>BUGGAMES</h1><p>Dev Bawapi • Check the Water</p><button id="btnStart">START</button><button id="btnBack">BACK</button><p style="font-size:12px;opacity:.7">Tower Defense Buaya Air — 13 Hewan • 4 Sungai</p></div>
<div id="maps" class="hidden"><h2>Pilih Map</h2>
<button data-map="0">Sungai Numbo — River 1 (Mudah)</button>
<button data-map="1">Sungai Numbo — River 2</button>
<button data-map="2">Sungai Lapisan Kayu (Kayu Gerak!)</button>
<button data-map="3">Sungai RajaMahalawa (Malam + Batu Bulan!)</button>
<button data-map="4">Sungai Gunung Purba — Kapal Bajak Laut 3D (3 Menit!) <span id="lock4">[LOCKED]</span></button>
<button data-mini="boss">Mini Games: Boss Kecil</button><button data-mini="croc">Mini Games: Lawan Buaya</button>
<button onclick="show('intro')">← Back</button></div>
<div id="game" class="hidden">
<div class="topbar"><button onclick="exitGame()">← Menu</button><span id="hud">Lv 1/7 • Cpin 0</span><span id="info">Tap hewan lalu tap tepi sungai</span></div>
<div id="shop"></div>
<canvas id="cv" width="960" height="540"></canvas>
<div id="msg"></div>
<div id="ship" class="hidden"><p id="shipTime">Sisa: 180s — Tembak monster besar dengan meriam! Tap monster.</p></div>
</div>
<script src="app.js"></script><script>if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))</script>
</body></html>
